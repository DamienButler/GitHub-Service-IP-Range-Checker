name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ESLint is fetched at CI time only via npx.
      # The shipped application has zero third-party dependencies.
      - name: Run ESLint
        run: npx --yes eslint@9 "js/**/*.js" eslint.config.js

      - name: Validate JSON data files
        run: |
          set -e
          for f in data/*.json; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null
          done
          echo "All JSON files are valid."

      - name: Validate workflow YAML
        run: |
          set -e
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit(0)  # yaml not present; skip rather than fail
          for p in pathlib.Path('.github').rglob('*.yml'):
              with p.open() as fh:
                  yaml.safe_load(fh)
              print(f"OK: {p}")
          PY

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Gitleaks needs full history to scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
